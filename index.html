<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 檔案編碼設定提示：UTF-8 (請確保您的編輯器使用 UTF-8 儲存此檔案，以免中文出現亂碼) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFL 英語單字小考生成器</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 列印專用 CSS，隱藏無關 UI 並調整列印邊距 */
    @media print {
      body {
        background-color: white;
        -webkit-print-color-adjust: exact;
      }
      .hide-on-print {
        display: none !important;
      }
      .print-page {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        aspect-ratio: auto !important;
        page-break-after: always;
      }
      .print-page:last-child {
        page-break-after: auto;
      }
      @page {
        size: A4 portrait;
        margin: 15mm;
      }
    }

    /* 頁面載入時隱藏管理後台 */
    #view-admin {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 font-sans">

  <!-- 頂部導航列 (列印時隱藏) -->
  <div class="bg-white shadow-sm hide-on-print sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex space-x-8">
        <button id="tab-generator" class="flex items-center px-4 py-4 border-b-2 font-medium transition-colors border-indigo-600 text-indigo-600">
          <i data-lucide="file-text" class="w-5 h-5 mr-2"></i>
          考卷生成器
        </button>
        <button id="tab-admin" class="flex items-center px-4 py-4 border-b-2 font-medium transition-colors border-transparent text-gray-500 hover:text-gray-700">
          <i data-lucide="settings" class="w-5 h-5 mr-2"></i>
          後台圖庫管理
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- ==================== 考卷生成器 (前端) ==================== -->
    <div id="view-generator" class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- 左側控制面板 (列印時隱藏) -->
      <div class="w-full lg:w-1/4 space-y-6 hide-on-print sticky top-24">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
          <h2 class="text-lg font-bold mb-4 flex items-center text-gray-800">
            <i data-lucide="settings" class="w-5 h-5 mr-2 text-indigo-600"></i>
            考卷設定
          </h2>
          
          <!-- 篩選器 -->
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">選擇年級</label>
              <select id="filter-grade" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">選擇學期</label>
              <select id="filter-semester" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">選擇單元</label>
              <select id="filter-unit" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">出題數量</label>
              <select id="filter-count" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="10">10 題</option>
                <option value="20">20 題</option>
                <option value="30">30 題</option>
                <option value="40">40 題</option>
                <option value="全部" selected>全部 (不限制)</option>
              </select>
            </div>
          </div>

          <hr class="my-6 border-gray-200" />

          <!-- 答題線條樣式切換 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">學生填寫格線</label>
            <div class="space-y-3">
              <label class="flex items-center space-x-3 cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors">
                <input type="radio" name="lineStyle" value="underline" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
                <span class="text-sm font-medium">單一底線</span>
              </label>
              <label class="flex items-center space-x-3 cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors">
                <input type="radio" name="lineStyle" value="four-line" checked class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" />
                <span class="text-sm font-medium">英文四線格</span>
              </label>
            </div>
          </div>

          <hr class="my-6 border-gray-200" />

          <!-- 動作按鈕 -->
          <div class="space-y-3">
            <button id="btn-generate" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium flex items-center justify-center transition-colors shadow-sm">
              <i data-lucide="shuffle" class="w-4 h-4 mr-2"></i>
              <span id="btn-generate-text">隨機產生</span>
            </button>
            <button id="btn-print" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium flex items-center justify-center transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
              <i data-lucide="printer" class="w-4 h-4 mr-2"></i>
              列印 A4 考卷
            </button>
          </div>
        </div>
      </div>

      <!-- 右側 A4 考卷預覽區 -->
      <div id="quiz-preview" class="w-full lg:w-3/4 flex flex-col items-center overflow-x-auto space-y-8 pb-10">
        <!-- 考卷內容將由 JS 動態生成 -->
      </div>
    </div>

    <!-- ==================== 後台圖庫管理 (後台) ==================== -->
    <div id="view-admin" class="space-y-8 hide-on-print max-w-5xl mx-auto">
      
      <!-- 新增單字表單 -->
      <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-6 flex items-center text-gray-800">
          <i data-lucide="plus" class="w-5 h-5 mr-2 text-indigo-600"></i>
          新增單字至圖庫
        </h2>
        <form id="add-vocab-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-6 items-end">
          
          <div class="lg:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">上傳圖片</label>
            <input type="file" id="input-image" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-gray-200 rounded-lg p-1 transition-colors" />
            <div id="image-preview-container" class="mt-3 w-20 h-20 border rounded-lg overflow-hidden flex items-center justify-center bg-gray-50 hidden">
              <img id="image-preview" src="" alt="Preview" class="max-w-full max-h-full object-contain" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">年級</label>
            <select id="input-grade" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="一年級">一年級</option>
              <option value="二年級">二年級</option>
              <option value="三年級" selected>三年級</option>
              <option value="四年級">四年級</option>
              <option value="五年級">五年級</option>
              <option value="六年級">六年級</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">學期</label>
            <select id="input-semester" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="上學期" selected>上學期</option>
              <option value="下學期">下學期</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">單元</label>
            <input type="text" id="input-unit" placeholder="例: Unit 1" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">英文單字解答</label>
            <input type="text" id="input-word" placeholder="例: apple" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>

          <div class="lg:col-span-6 flex justify-end mt-2">
            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors shadow-sm flex items-center">
              <i data-lucide="plus" class="w-4 h-4 mr-2"></i>
              新增至圖庫
            </button>
          </div>
        </form>
      </div>

      <!-- 現有圖庫列表 -->
      <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-6 flex items-center text-gray-800">
          <i data-lucide="image" class="w-5 h-5 mr-2 text-indigo-600"></i>
          目前圖庫清單 (<span id="vocab-count">0</span> 筆)
        </h2>
        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">
                <th class="p-4 font-semibold text-gray-600">圖片</th>
                <th class="p-4 font-semibold text-gray-600">年級</th>
                <th class="p-4 font-semibold text-gray-600">學期</th>
                <th class="p-4 font-semibold text-gray-600">單元</th>
                <th class="p-4 font-semibold text-gray-600">單字解答</th>
                <th class="p-4 font-semibold text-gray-600 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="vocab-table-body" class="divide-y divide-gray-100">
              <!-- 列表內容將由 JS 動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 提示訊息 (代替 alert) -->
  <div id="toast" class="fixed bottom-6 right-6 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-opacity duration-300 opacity-0 z-50 flex items-center">
    <i data-lucide="alert-circle" class="w-5 h-5 mr-2"></i>
    <span id="toast-message">提示訊息</span>
  </div>

  <script>
    // 初始化 Lucide Icons
    lucide.createIcons();

    // --- 初始假資料 (示範圖庫) ---
    let vocabBank = [
      { id: 1, image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b614d5?auto=format&fit=crop&w=300&q=80', grade: '三年級', semester: '上學期', unit: 'Unit 1', word: 'apple' },
      { id: 2, image: 'https://images.unsplash.com/photo-1528825871115-3581a5387919?auto=format&fit=crop&w=300&q=80', grade: '三年級', semester: '上學期', unit: 'Unit 1', word: 'banana' },
      { id: 3, image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=300&q=80', grade: '三年級', semester: '上學期', unit: 'Unit 1', word: 'cat' },
      { id: 4, image: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80', grade: '三年級', semester: '上學期', unit: 'Unit 2', word: 'dog' },
      { id: 5, image: 'https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=300&q=80', grade: '四年級', semester: '下學期', unit: 'Unit 1', word: 'elephant' },
      { id: 6, image: 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=300&q=80', grade: '三年級', semester: '上學期', unit: 'Unit 2', word: 'bird' },
    ];

    let currentQuiz = [];
    let uploadedImageUrl = '';

    // --- 輔助函式：UI 與提示 ---
    function showToast(message, isSuccess = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      
      toast.className = `fixed bottom-6 right-6 text-white px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 z-50 flex items-center ${isSuccess ? 'bg-emerald-600' : 'bg-red-600'}`;
      toastMsg.innerText = message;
      
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.classList.add('hidden'), 300);
      }, 3000);
    }

    // --- 輔助函式：格線 HTML 生成 ---
    const getFourLineGridHtml = () => `
      <div class="w-full h-14 relative flex flex-col justify-between pt-1 mt-2">
        <div class="w-full border-t border-gray-400"></div>
        <div class="w-full border-t border-dashed border-gray-400 absolute top-1/3 left-0"></div>
        <div class="w-full border-t border-red-500 absolute top-2/3 left-0"></div>
        <div class="w-full border-t border-gray-400 absolute bottom-0 left-0"></div>
      </div>
    `;

    const getSingleUnderlineHtml = () => `
      <div class="w-full h-14 flex items-end mt-2">
        <div class="w-full border-b-2 border-black"></div>
      </div>
    `;

    // --- 核心邏輯 ---

    // 洗牌演算法 (Fisher-Yates)
    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    // 更新篩選器的下拉選單選項
    function updateFiltersDropdown() {
      const grades = ['全部', ...new Set(vocabBank.map(v => v.grade))];
      const semesters = ['全部', ...new Set(vocabBank.map(v => v.semester))];
      const units = ['全部', ...new Set(vocabBank.map(v => v.unit))];

      const renderOptions = (arr, elementId) => {
        const el = document.getElementById(elementId);
        const currentValue = el.value;
        el.innerHTML = arr.map(item => `<option value="${item}">${item}</option>`).join('');
        if (arr.includes(currentValue)) el.value = currentValue;
      };

      renderOptions(grades, 'filter-grade');
      renderOptions(semesters, 'filter-semester');
      renderOptions(units, 'filter-unit');
    }

    // 渲染後台單字列表
    function renderAdminTable() {
      const tbody = document.getElementById('vocab-table-body');
      document.getElementById('vocab-count').innerText = vocabBank.length;

      if (vocabBank.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-gray-500">目前圖庫沒有任何單字，請從上方表單新增。</td></tr>`;
        return;
      }

      tbody.innerHTML = vocabBank.map(item => `
        <tr class="hover:bg-gray-50/50 transition-colors">
          <td class="p-4">
            <div class="w-14 h-14 bg-white border border-gray-200 rounded-lg flex items-center justify-center p-1">
              <img src="${item.image}" alt="${item.word}" class="max-w-full max-h-full object-contain" />
            </div>
          </td>
          <td class="p-4 text-gray-700 font-medium">${item.grade}</td>
          <td class="p-4 text-gray-700 font-medium">${item.semester}</td>
          <td class="p-4">
            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">
              ${item.unit}
            </span>
          </td>
          <td class="p-4 font-bold text-gray-900 text-lg">${item.word}</td>
          <td class="p-4 text-center">
            <button onclick="deleteVocab(${item.id})" class="p-2 text-red-500 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors" title="刪除">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // 刪除單字
    window.deleteVocab = function(id) {
      vocabBank = vocabBank.filter(v => v.id !== id);
      updateFiltersDropdown();
      renderAdminTable();
      generateQuiz(); // 同步更新考卷預覽
    };

    // 生成並渲染考卷預覽
    function generateQuiz() {
      const filterGrade = document.getElementById('filter-grade').value;
      const filterSemester = document.getElementById('filter-semester').value;
      const filterUnit = document.getElementById('filter-unit').value;
      const filterCount = document.getElementById('filter-count').value;
      const lineStyle = document.querySelector('input[name="lineStyle"]:checked').value;

      let filtered = vocabBank;
      if (filterGrade && filterGrade !== '全部') filtered = filtered.filter(v => v.grade === filterGrade);
      if (filterSemester && filterSemester !== '全部') filtered = filtered.filter(v => v.semester === filterSemester);
      if (filterUnit && filterUnit !== '全部') filtered = filtered.filter(v => v.unit === filterUnit);

      let shuffled = shuffleArray(filtered);
      
      if (filterCount !== '全部') {
        shuffled = shuffled.slice(0, parseInt(filterCount, 10));
      }

      currentQuiz = shuffled;
      
      document.getElementById('btn-generate-text').innerText = `隨機產生 (${currentQuiz.length} 題)`;
      
      const printBtn = document.getElementById('btn-print');
      if (currentQuiz.length === 0) {
        printBtn.disabled = true;
      } else {
        printBtn.disabled = false;
      }

      renderQuizPreview(lineStyle);
    }

    // 渲染 A4 考卷畫面
    function renderQuizPreview(lineStyle) {
      const container = document.getElementById('quiz-preview');
      
      if (currentQuiz.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center h-64 text-gray-400 hide-on-print w-full bg-white rounded-xl border border-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-30"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>目前沒有符合條件的單字，請調整左側篩選器或至後台新增。</p>
          </div>
        `;
        return;
      }

      const QUESTIONS_PER_PAGE = 12;
      const pages = [];
      for (let i = 0; i < currentQuiz.length; i += QUESTIONS_PER_PAGE) {
        pages.push(currentQuiz.slice(i, i + QUESTIONS_PER_PAGE));
      }

      const filterGrade = document.getElementById('filter-grade').value;
      const gradeText = filterGrade === '全部' ? '' : filterGrade;

      let html = '';
      pages.forEach((pageData, pageIndex) => {
        const pageIndicator = pages.length > 1 ? `<span class="text-xl font-normal ml-2 tracking-normal text-gray-600">(P. ${pageIndex + 1})</span>` : '';
        const scoreSection = pageIndex === 0 
          ? `<span>分數：<span class="inline-block w-24 border-b border-gray-800 text-center text-red-600 text-2xl font-bold"></span></span>` 
          : `<span class="inline-block w-24"></span>`;

        html += `
          <div class="print-page bg-white shadow-xl w-full max-w-[210mm] aspect-[1/1.414] p-10 md:p-14 relative border border-gray-200 flex flex-col">
            <div class="text-center mb-6 border-b-2 border-gray-800 pb-4 shrink-0">
              <h1 class="text-3xl font-bold mb-4 tracking-widest text-gray-900">
                英語單字小考 ${pageIndicator}
              </h1>
              <div class="flex justify-between items-end text-lg font-medium px-2">
                <div class="flex space-x-6">
                  <span>年級：<span class="inline-block w-16 border-b border-gray-800 text-center">${gradeText}</span></span>
                  <span>班級：<span class="inline-block w-16 border-b border-gray-800"></span></span>
                  <span>座號：<span class="inline-block w-16 border-b border-gray-800"></span></span>
                  <span>姓名：<span class="inline-block w-32 border-b border-gray-800"></span></span>
                </div>
                <div>${scoreSection}</div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-x-12 gap-y-10 flex-grow content-start">
        `;

        pageData.forEach((item, index) => {
          const globalIndex = pageIndex * QUESTIONS_PER_PAGE + index + 1;
          const lineHtml = lineStyle === 'four-line' ? getFourLineGridHtml() : getSingleUnderlineHtml();
          
          html += `
            <div class="flex items-center space-x-4 break-inside-avoid">
              <div class="flex items-center space-x-3 w-[45%]">
                <span class="font-bold text-xl">${globalIndex}.</span>
                <div class="w-24 h-24 border-2 border-gray-300 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center bg-white shadow-sm p-1">
                  <img src="${item.image}" alt="Quiz Item" class="max-w-full max-h-full object-contain mix-blend-multiply" />
                </div>
              </div>
              <div class="w-[55%] pb-2">
                ${lineHtml}
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // --- 事件綁定 ---

    // 頁籤切換
    document.getElementById('tab-generator').addEventListener('click', (e) => {
      document.getElementById('view-generator').style.display = 'flex';
      document.getElementById('view-admin').style.display = 'none';
      e.currentTarget.classList.add('border-indigo-600', 'text-indigo-600');
      e.currentTarget.classList.remove('border-transparent', 'text-gray-500');
      document.getElementById('tab-admin').classList.add('border-transparent', 'text-gray-500');
      document.getElementById('tab-admin').classList.remove('border-indigo-600', 'text-indigo-600');
    });

    document.getElementById('tab-admin').addEventListener('click', (e) => {
      document.getElementById('view-generator').style.display = 'none';
      document.getElementById('view-admin').style.display = 'block';
      e.currentTarget.classList.add('border-indigo-600', 'text-indigo-600');
      e.currentTarget.classList.remove('border-transparent', 'text-gray-500');
      document.getElementById('tab-generator').classList.add('border-transparent', 'text-gray-500');
      document.getElementById('tab-generator').classList.remove('border-indigo-600', 'text-indigo-600');
    });

    // 圖片預覽處理
    document.getElementById('input-image').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        uploadedImageUrl = URL.createObjectURL(file);
        document.getElementById('image-preview').src = uploadedImageUrl;
        document.getElementById('image-preview-container').classList.remove('hidden');
      } else {
        uploadedImageUrl = '';
        document.getElementById('image-preview-container').classList.add('hidden');
      }
    });

    // 新增單字表單提交
    document.getElementById('add-vocab-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const grade = document.getElementById('input-grade').value;
      const semester = document.getElementById('input-semester').value;
      const unit = document.getElementById('input-unit').value.trim();
      const word = document.getElementById('input-word').value.trim();

      if (!uploadedImageUrl || !unit || !word) {
        showToast("請完整上傳圖片、填寫單元與單字！");
        return;
      }

      const newItem = {
        id: Date.now(),
        image: uploadedImageUrl,
        grade,
        semester,
        unit,
        word
      };

      vocabBank.push(newItem);
      
      // 重設表單
      this.reset();
      uploadedImageUrl = '';
      document.getElementById('image-preview-container').classList.add('hidden');
      document.getElementById('image-preview').src = '';
      
      updateFiltersDropdown();
      renderAdminTable();
      generateQuiz();
      
      showToast("單字新增成功！", true);
    });

    // 篩選器與選項變更時自動重新生成考卷
    ['filter-grade', 'filter-semester', 'filter-unit', 'filter-count'].forEach(id => {
      document.getElementById(id).addEventListener('change', generateQuiz);
    });

    document.querySelectorAll('input[name="lineStyle"]').forEach(radio => {
      radio.addEventListener('change', generateQuiz);
    });

    // 手動點擊隨機產生
    document.getElementById('btn-generate').addEventListener('click', generateQuiz);

    // 列印按鈕
    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });

    // --- 初始化執行 ---
    updateFiltersDropdown();
    renderAdminTable();
    generateQuiz();

  </script>
</body>
</html>
